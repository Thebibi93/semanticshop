services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semanticshop}
      POSTGRES_USER: ${POSTGRES_USER:-semanticshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semanticshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semanticshop} -d ${POSTGRES_DB:-semanticshop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  django:
    build: ./backend/django
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-semanticshop}:${POSTGRES_PASSWORD:-semanticshop}@db:5432/${POSTGRES_DB:-semanticshop}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
      FASTAPI_URL: http://fastapi:8001
      EMBED_ON_SAVE: "true"
      SEED_DATASET: ${SEED_DATASET:-ashraq/fashion-product-images-small}
      SEED_LIMIT: ${SEED_LIMIT:-120}
      HF_HOME: /cache/huggingface
    volumes:
      - hf_django:/cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started

  fastapi:
    build: ./backend/fastapi
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-semanticshop}:${POSTGRES_PASSWORD:-semanticshop}@db:5432/${POSTGRES_DB:-semanticshop}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: "384"
      HF_HOME: /cache/huggingface
    volumes:
      - hf_fastapi:/cache
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - django
      - fastapi

volumes:
  pgdata:
  hf_django:
  hf_fastapi:
