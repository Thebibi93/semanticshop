<section class="login-wrap">
  <div class="login-card">
    <h1>Connexion</h1>
    <p class="muted">
      Comptes de démo : <strong>admin / admin1234</strong> (équipe) ou <strong>demo / demo1234</strong> (client)
    </p>
    <form class="login-form" (submit)="submit($event)">
      <label class="field">
        <span>Identifiant</span>
        <input
          #usernameBox
          type="text"
          [value]="username()"
          (input)="username.set(usernameBox.value)"
          autocomplete="username"
          aria-label="Identifiant"
        />
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input
          #passwordBox
          type="password"
          [value]="password()"
          (input)="password.set(passwordBox.value)"
          autocomplete="current-password"
          aria-label="Mot de passe"
        />
      </label>
      @if (error()) {
        <p class="form-error">{{ error() }}</p>
      }
      <button class="btn primary wide" type="submit" [disabled]="submitting()">
        {{ submitting() ? "Connexion…" : "Se connecter" }}
      </button>
    </form>
    <a class="back-link" routerLink="/">← Retour à la recherche</a>
  </div>
</section>
