@if (ui.cartOpen()) {
  <div class="drawer-backdrop" (click)="ui.closeAll()"></div>
  <aside class="drawer">
    <div class="drawer-head">
      <h2>Panier</h2>
      <button class="icon-btn" type="button" (click)="ui.closeAll()" aria-label="Fermer le panier">✕</button>
    </div>
    <div class="drawer-body">
      @if (cart.items().length === 0) {
        <p class="empty-note">Ton panier est vide.</p>
      } @else {
        <div class="cart-list">
          @for (item of cart.items(); track item.productId) {
            <div class="cart-item">
              <div class="cart-info">
                <strong>{{ item.title }}</strong>
                <span class="muted">{{ item.price | euros }} × {{ item.quantity }}</span>
              </div>
              <div class="steppers">
                <button
                  class="qty"
                  type="button"
                  (click)="cart.decrement(item.productId)"
                  aria-label="Retirer un exemplaire"
                >
                  −
                </button>
                <button
                  class="qty"
                  type="button"
                  (click)="cart.increment(item.productId)"
                  aria-label="Ajouter un exemplaire"
                >
                  +
                </button>
                <button
                  class="qty remove"
                  type="button"
                  (click)="cart.remove(item.productId)"
                  aria-label="Supprimer l'article"
                >
                  ✕
                </button>
              </div>
            </div>
          }
        </div>
        <div class="total-row">
          <span class="muted">Total estimé</span>
          <strong class="price">{{ cart.total() | euros }}</strong>
        </div>
        <button
          class="btn primary wide"
          type="button"
          (click)="checkout()"
          [disabled]="submitting() || cart.items().length === 0"
        >
          {{ submitting() ? "Commande en cours…" : "Commander" }}
        </button>
      }
    </div>
  </aside>
}
